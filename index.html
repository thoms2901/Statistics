<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistics - Homework</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fbfaf6;
      color: #292720;
      font: 17px/1.55 Georgia, "Times New Roman", serif;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: clamp(48px, 10vh, 100px) 24px 64px;
    }

    header {
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid #d8d3c7;
    }

    .course {
      max-width: 440px;
      color: #706b61;
      font: 13px/1.7 system-ui, sans-serif;
    }

    h1 {
      margin: 14px 0 0;
      font-size: clamp(38px, 6vw, 52px);
      font-weight: normal;
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .hw {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .hw a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      padding: 28px;
      border: 1px solid #d8d3c7;
      border-radius: 8px;
      background: #fffefa;
      color: #554137;
      font-size: 26px;
      text-decoration: none;
      box-shadow: 0 3px 10px rgb(55 43 28 / 3%);
      transition: border-color 160ms, background-color 160ms, box-shadow 160ms;
    }

    .hw a:hover {
      border-color: #9c8270;
      background: #f5f0e7;
      box-shadow: 0 5px 16px rgb(55 43 28 / 7%);
    }

    .hw a:focus-visible {
      outline: 2px solid #795847;
      outline-offset: 5px;
    }

    @media (max-width: 480px) {
      .hw { grid-template-columns: 1fr; gap: 14px; }
      .hw a { min-height: 112px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hw a { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="course">Statistics, MSc Cybersecurity, Sapienza, a.y. 2026/27</div>
      <h1>Homework</h1>
    </header>

    <ol class="hw">
      <li><a href="hw1/">Homework 1</a></li>
      <li><a href="hw2/">Homework 2</a></li>
      <li><a href="hw3/">Homework 3</a></li>
      <li><a href="hw4/">Homework 4</a></li>
      <li><a href="hw5/">Homework 5</a></li>
      <li><a href="hw6/">Homework 6</a></li>
    </ol>

  </main>
</body>

</html>
